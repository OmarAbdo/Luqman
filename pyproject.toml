[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "luqman"
version = "2.0.0a0"
description = "Forecasting engine with baseline-anchored evaluation and costed backtesting"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11",
    "arch>=7.0",
    "pyarrow>=15",
    "yfinance>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
torch = ["torch>=2.2"]

[project.scripts]
luqman = "luqman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
